name: ai-app-generation-prod

services:
  nginx:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.nginx
    image: ai-app-generation-nginx:latest
    container_name: ai-nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${NGINX_HOST_PORT}:80"
    volumes:
      - code_deploy_data:/opt/code_deploy:ro
    networks:
      - ai_net

  backend:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.backend
    image: ai-app-generation-backend:latest
    container_name: ai-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      pg:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 9025
      SERVER_SERVLET_CONTEXT_PATH: /api
      APP_CODE_DEPLOY_HOST: ${APP_CODE_DEPLOY_HOST}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ai_app_generation?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_USERNAME: ${REDIS_USERNAME}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      RAG_PGVECTOR_HOST: pg
      RAG_PGVECTOR_PORT: 5432
      RAG_PGVECTOR_DATABASE: ai_codegen_rag
      RAG_PGVECTOR_USER: ${PG_USER}
      RAG_PGVECTOR_PASSWORD: ${PG_PASSWORD}
      RAG_HYBRID_ENABLED: ${RAG_HYBRID_ENABLED:-false}
      RAG_TEMPLATES_DIR: /app/embed_text
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      AI_MODEL_LOG_REQUESTS: "false"
      AI_MODEL_LOG_RESPONSES: "false"
      COS_HOST: ${COS_HOST}
      TEN_SERCET_ID: ${TEN_SERCET_ID}
      TEN_SECRET_KEY: ${TEN_SECRET_KEY}
      PEXELS_API_KEY: ${PEXELS_API_KEY}
      CHROME_BIN: /usr/bin/google-chrome
      WEBDRIVER_CHROME_DRIVER: /usr/bin/chromedriver
    ports:
      - "${BACKEND_HOST_PORT}:9025"
    volumes:
      - tmp_data:/app/tmp
      - code_deploy_data:/app/tmp/code_deploy
      - ./embed_text:/app/embed_text:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9025/api/actuator/health | grep -q UP"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - ai_net

  mysql:
    image: mysql:8.0.40
    container_name: ai-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ai_app_generation
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - ai_net

  redis:
    image: redis:7.0.15
    container_name: ai-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--aclfile", "/usr/local/etc/redis/users.acl"]
    volumes:
      - redis_data:/data
      - ./redis/users.acl:/usr/local/etc/redis/users.acl:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --user ${REDIS_USERNAME} -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - ai_net

  pg:
    image: pgvector/pgvector:pg16
    container_name: ai-pg
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      POSTGRES_DB: ai_codegen_rag
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init/01-enable-pgvector.sql:/docker-entrypoint-initdb.d/01-enable-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ai_codegen_rag"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - ai_net

  prometheus:
    image: prom/prometheus:latest
    container_name: ai-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_HOST_PORT}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - ai_net

  grafana:
    image: grafana/grafana:latest
    container_name: ai-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "${GRAFANA_HOST_PORT}:3000"
    environment:
      TZ: Asia/Shanghai
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards/ai-model-observability-dashboard.json:/var/lib/grafana/dashboards/ai-model-observability-dashboard.json:ro
    networks:
      - ai_net

networks:
  ai_net:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  pg_data:
  tmp_data:
  code_deploy_data:
  prometheus_data:
  grafana_data:
