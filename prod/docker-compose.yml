name: ai-app-generation-prod

services:
  nginx:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.nginx
    image: ai-app-generation-nginx:latest
    container_name: ai-nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - code_deploy_data:/opt/code_deploy:ro
    networks:
      - ai_net

  backend:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.backend
    image: ai-app-generation-backend:latest
    container_name: ai-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 9025
      SERVER_SERVLET_CONTEXT_PATH: /api
      APP_CODE_DEPLOY_BASE_URL: ${APP_CODE_DEPLOY_BASE_URL}
      INFRA_SHARED_PASSWORD: ${INFRA_SHARED_PASSWORD:?INFRA_SHARED_PASSWORD不能为空}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ai_app_generation?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&connectTimeout=5000&socketTimeout=30000
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${INFRA_SHARED_PASSWORD:?INFRA_SHARED_PASSWORD不能为空}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_USERNAME: ${REDIS_USERNAME}
      SPRING_DATA_REDIS_PASSWORD: ${INFRA_SHARED_PASSWORD:?INFRA_SHARED_PASSWORD不能为空}
      RAG_MILVUS_HOST: milvus
      RAG_MILVUS_PORT: 19530
      RAG_MILVUS_DATABASE: default
      RAG_MILVUS_USERNAME: root
      RAG_MILVUS_PASSWORD: ${INFRA_SHARED_PASSWORD:?INFRA_SHARED_PASSWORD不能为空}
      RAG_HYBRID_ENABLED: ${RAG_HYBRID_ENABLED:-false}
      RAG_TEMPLATES_DIR: /app/embed_text
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      AI_MODEL_LOG_REQUESTS: "false"
      AI_MODEL_LOG_RESPONSES: "false"
      COS_HOST: ${COS_HOST}
      TEN_SERCET_ID: ${TEN_SERCET_ID}
      TEN_SECRET_KEY: ${TEN_SECRET_KEY}
      PEXELS_API_KEY: ${PEXELS_API_KEY}
      CHROME_BIN: /usr/bin/google-chrome
      WEBDRIVER_CHROME_DRIVER: /usr/bin/chromedriver
    ports:
      - "${BACKEND_HOST_PORT}:9025"
    volumes:
      - tmp_data:/app/tmp
      - code_deploy_data:/app/tmp/code_deploy
      - ./embed_text:/app/embed_text:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9025/api/actuator/health | grep -q UP"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - ai_net

  mysql:
    image: mysql:8.0.40
    container_name: ai-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${INFRA_SHARED_PASSWORD:?INFRA_SHARED_PASSWORD不能为空}
      MYSQL_DATABASE: ai_app_generation
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${INFRA_SHARED_PASSWORD:?INFRA_SHARED_PASSWORD不能为空}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$${MYSQL_ROOT_PASSWORD} mysqladmin ping -uroot --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - ai_net

  redis:
    image: redis:7.0.15
    container_name: ai-redis
    restart: unless-stopped
    environment:
      REDIS_USERNAME: ${REDIS_USERNAME:?REDIS_USERNAME不能为空}
      INFRA_SHARED_PASSWORD: ${INFRA_SHARED_PASSWORD:?INFRA_SHARED_PASSWORD不能为空}
    command: ["/usr/local/bin/start-redis.sh"]
    volumes:
      - redis_data:/data
      - ./redis/start-redis.sh:/usr/local/bin/start-redis.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$${INFRA_SHARED_PASSWORD} redis-cli --user $${REDIS_USERNAME} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - ai_net

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: ai-milvus-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: 1000
      ETCD_QUOTA_BACKEND_BYTES: 4294967296
      ETCD_SNAPSHOT_COUNT: 50000
    command: >-
      etcd -advertise-client-urls=http://milvus-etcd:2379
      -listen-client-urls http://0.0.0.0:2379
      --data-dir /etcd
    volumes:
      - milvus_etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - ai_net

  milvus-minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: ai-milvus-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: ${MILVUS_MINIO_PASSWORD:?MILVUS_MINIO_PASSWORD不能为空}
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - milvus_minio_data:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - ai_net

  milvus:
    image: milvusdb/milvus:v2.5.9
    container_name: ai-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: ${MILVUS_MINIO_PASSWORD:?MILVUS_MINIO_PASSWORD不能为空}
      COMMON_SECURITY_AUTHORIZATIONENABLED: "true"
      COMMON_SECURITY_DEFAULTROOTPASSWORD: ${INFRA_SHARED_PASSWORD:?INFRA_SHARED_PASSWORD不能为空}
      QUOTAANDLIMITS_FLUSHRATE_COLLECTION_MAX: "-1"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      milvus-etcd:
        condition: service_healthy
      milvus-minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    networks:
      - ai_net

  prometheus:
    image: prom/prometheus:latest
    container_name: ai-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_HOST_PORT}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - ai_net

  grafana:
    image: grafana/grafana:latest
    container_name: ai-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "${GRAFANA_HOST_PORT}:3000"
    environment:
      TZ: Asia/Shanghai
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${INFRA_SHARED_PASSWORD:?INFRA_SHARED_PASSWORD不能为空}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards/ai-model-observability-dashboard.json:/var/lib/grafana/dashboards/ai-model-observability-dashboard.json:ro
    networks:
      - ai_net

networks:
  ai_net:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  milvus_etcd_data:
  milvus_minio_data:
  milvus_data:
  tmp_data:
  code_deploy_data:
  prometheus_data:
  grafana_data:
