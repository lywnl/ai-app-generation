server:
  port: 9025
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000
spring:
  mvc:
    async:
      request-timeout: 1845000  # SSE 运输层 30 分 45 秒，为 Vue 终态收尾保留余量
  application:
    name: ai-app-generation
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 依赖 I/O 上限必须短于 L1 60 秒总截止，避免迟到 worker 长期占满压缩池。
    url: jdbc:mysql://127.0.0.1:3406/ai_app_generation?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&connectTimeout=5000&socketTimeout=30000
    username: root
    password: ${INFRA_SHARED_PASSWORD}
    hikari:
      connection-timeout: 30000   # 从连接池获取连接的最大等待时间（毫秒）
      max-lifetime: 1800000       # 连接在池中的最大存活时间（毫秒）
      idle-timeout: 600000
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      username: default
      password: ${INFRA_SHARED_PASSWORD}
      ttl: 3600
      connect-timeout: 3s
      timeout: 3s
      jedis:
        pool:
          max-wait: 3s
  session:
    store-type: redis
    # session 30 天过期
    timeout: 2592000

# AI
# 模型正文日志会包含用户提示词、RAG 模板源码和生成内容，仅允许本地临时显式开启；生产强制关闭。
langchain4j:
  open-ai:
    chat-model:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY}
      model-name: deepseek-v4-flash
      log-requests: ${AI_MODEL_LOG_REQUESTS:false}
      log-responses: ${AI_MODEL_LOG_RESPONSES:false}
      max-tokens: 8192
 #     strict-json-schema: true  # 严格遵守JSON Schema
 #     response-format: json_object #json格式输出
      max-retries: 2
    streaming-chat-model:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY}
      model-name: deepseek-v4-flash
      max-tokens: 8192
      log-requests: ${AI_MODEL_LOG_REQUESTS:false}
      log-responses: ${AI_MODEL_LOG_RESPONSES:false}
    # 推理 AI 模型配置（用于复杂的推理任务）
    reasoning-streaming-chat-model:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY}
      model-name: deepseek-v4-flash
      max-tokens: 8192
      temperature: 0.1
      log-requests: ${AI_MODEL_LOG_REQUESTS:false}
      log-responses: ${AI_MODEL_LOG_RESPONSES:false}
    # 智能路由 AI 模型配置（用于简单的分类任务）
    routing-chat-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${DASHSCOPE_API_KEY}
      model-name: qwen-turbo
      log-requests: ${AI_MODEL_LOG_REQUESTS:false}
      log-responses: ${AI_MODEL_LOG_RESPONSES:false}


# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.lyw.appgeneration.controller
# knife
knife4j:
  enable: true
  setting:
    language: zh_cn

app:
  code:
    deploy:
      # 完整部署访问基地址必须由运行环境显式提供，不允许跨环境静默回退。
      base-url: ${APP_CODE_DEPLOY_BASE_URL}
  cors:
    # 空列表表示只允许同源；跨域部署必须显式列出可信 HTTPS Origin。
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}


# 添加 COS 对象存储配置（需要从腾讯云获取）
cos:
  client:
    host: ${COS_HOST}
    secretId: ${TEN_SERCET_ID}
    secretKey: ${TEN_SECRET_KEY}
    region: ap-beijing
    bucket: ai-gen-app-1374604134


# Pexels 图片搜索配置
pexels:
  api-key: ${PEXELS_API_KEY}

# 阿里云 DashScope 配置
dashscope:
  api-key: ${DASHSCOPE_API_KEY}
  image-model: wan2.2-t2i-flash


# RAG 检索增强配置(接入点 B:主生成前注入)
rag:
  enabled: true
  hybrid:
    enabled: ${RAG_HYBRID_ENABLED:true}
  # 模板库根目录(文件系统路径,非 classpath)
  templates-dir: ${RAG_TEMPLATES_DIR:embed_text}
  ingest:
    enabled: false            # 只在策展变化时手动改 true 跑一次
  milvus:
    host: ${RAG_MILVUS_HOST:localhost}
    port: ${RAG_MILVUS_PORT:19530}
    database: ${RAG_MILVUS_DATABASE:default}
    username: ${RAG_MILVUS_USERNAME:root}
    password: ${RAG_MILVUS_PASSWORD:${INFRA_SHARED_PASSWORD}}
  embedding:
    # 走 DashScope OpenAI 兼容端点,复用 dashscope.api-key
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model-name: text-embedding-v4
    dimension: 1024
    timeout-ms: 10000
  retrieval:
    top-k: 3
    min-score: 0.30            # 放宽以给 rerank 留足候选池(原 0.55)
    timeout-ms: 2000
  rerank:
    enabled: true
    base-url: https://dashscope.aliyuncs.com/api/v1/services/rerank/text-rerank/text-rerank
    model-name: gte-rerank-v2
    top-n: 10                  # 粗召回候选数;rerank 后按 retrieval.top-k 截断
    doc-char-limit: 2000
    timeout-ms: 3000
  prompt:
    max-context-chars: 4000          # 注入模板的总字符预算(约 2000 token)

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

ai:
  memory:
    token:
      l0-retained-tokens: 12288
      l1-max-summary-tokens: 3072
      l2-max-recall-tokens: 1024
      async-compression-threshold: 49152
      blocking-compression-threshold: 57344
      hard-input-limit: 65536
      max-output-tokens: 8192
      minimum-model-context-window: 73728
      blocking-timeout: 60s
      l2-debounce: 30s
      estimation-safety-factor: 1.15
  vue:
    tool-budget:
      max-single-file-code-points: 128000
      max-cumulative-mutation-code-points: 256000
      max-canonical-ai-text-code-points: 384000
      max-read-file-code-points: 128000
      max-read-dir-code-points: 20000
