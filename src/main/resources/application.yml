server:
  port: 9025
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000
spring:
  mvc:
    async:
      request-timeout: 600000  # SSE 流式接口异步超时时间：10分钟
  application:
    name: ai-app-generation
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3406/ai_app_generation?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: lyw666
  data:
    redis:
      host: localhost
      port: 6379
      user: default
      password: lyw666
      ttl: 3600
  session:
    store-type: redis
    # session 30 天过期
    timeout: 2592000


# AI
langchain4j:
  open-ai:
    chat-model:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY}
      model-name: deepseek-chat
      log-requests: true
      log-responses: true
      max-tokens: 8192
 #     strict-json-schema: true  # 严格遵守JSON Schema
 #     response-format: json_object #json格式输出
      max-retries: 2
    streaming-chat-model:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY}
      model-name: deepseek-chat
      max-tokens: 8192
      log-requests: true
      log-responses: true


# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.lyw.appgeneration.controller
# knife
knife4j:
  enable: true
  setting:
    language: zh_cn


# 添加 COS 对象存储配置（需要从腾讯云获取）
cos:
  client:
    host: ${COS_HOST}
    secretId: ${TEN_SERCET_ID}
    secretKey: ${TEN_SECRET_KEY}
    region: ap-beijing
    bucket: ai-gen-app-1374604134


# Pexels 图片搜索配置
pexels:
  api-key: ${PEXELS_API_KEY}

