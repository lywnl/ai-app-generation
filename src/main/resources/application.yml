server:
  port: 9025
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000
spring:
  mvc:
    async:
      request-timeout: 600000  # SSE 流式接口异步超时时间：10分钟
  application:
    name: ai-app-generation
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3406/ai_app_generation?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: lyw666
    hikari:
      connection-timeout: 30000   # 从连接池获取连接的最大等待时间（毫秒）
      max-lifetime: 1800000       # 连接在池中的最大存活时间（毫秒）
      idle-timeout: 600000
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      username: default
      password: lyw666
      ttl: 3600
  session:
    store-type: redis
    # session 30 天过期
    timeout: 2592000

# AI
langchain4j:
  open-ai:
    chat-model:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY}
      model-name: deepseek-chat
      log-requests: true
      log-responses: true
      max-tokens: 8192
 #     strict-json-schema: true  # 严格遵守JSON Schema
 #     response-format: json_object #json格式输出
      max-retries: 2
    streaming-chat-model:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY}
      model-name: deepseek-chat
      max-tokens: 8192
      log-requests: true
      log-responses: true
    # 推理 AI 模型配置（用于复杂的推理任务）
    reasoning-streaming-chat-model:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY}
      model-name: deepseek-chat
      max-tokens: 8192
      temperature: 0.1
      log-requests: true
      log-responses: true
    # 智能路由 AI 模型配置（用于简单的分类任务）
    routing-chat-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${DASHSCOPE_API_KEY}
      model-name: qwen-turbo
      log-requests: true
      log-responses: true


# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.lyw.appgeneration.controller
# knife
knife4j:
  enable: true
  setting:
    language: zh_cn


# 添加 COS 对象存储配置（需要从腾讯云获取）
cos:
  client:
    host: ${COS_HOST}
    secretId: ${TEN_SERCET_ID}
    secretKey: ${TEN_SECRET_KEY}
    region: ap-beijing
    bucket: ai-gen-app-1374604134


# Pexels 图片搜索配置
pexels:
  api-key: ${PEXELS_API_KEY}

# 阿里云 DashScope 配置
dashscope:
  api-key: ${DASHSCOPE_API_KEY}
  image-model: wan2.2-t2i-flash


# RAG 检索增强配置(接入点 B:主生成前注入)
rag:
  enabled: true
  # 模板库根目录(文件系统路径,非 classpath)
  templates-dir: D:/ai-app-generation/embed_text
  ingest:
    enabled: false            # 只在策展变化时手动改 true 跑一次
  pgvector:
    host: localhost
    port: 5432
    database: ai_codegen_rag
    user: admin
    password: lyw666
  embedding:
    # 走 DashScope OpenAI 兼容端点,复用 dashscope.api-key
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model-name: text-embedding-v4
    dimension: 1024
    timeout-ms: 10000
  retrieval:
    top-k: 3
    min-score: 0.30            # 放宽以给 rerank 留足候选池(原 0.55)
    timeout-ms: 2000
  rerank:
    enabled: true
    base-url: https://dashscope.aliyuncs.com/api/v1/services/rerank/text-rerank/text-rerank
    model-name: gte-rerank-v2
    top-n: 10                  # 粗召回候选数;rerank 后按 retrieval.top-k 截断
    doc-char-limit: 2000
    timeout-ms: 3000
  prompt:
    max-context-chars: 4000          # 注入模板的总字符预算(约 2000 token)

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always


