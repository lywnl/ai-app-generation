schema: spec-driven
workflow_profile: strict
risk_reason: 用户确认沿用 strict；调整已持久化计划的状态语义与构建依赖解释，需要独立规划及代码评审。
requirement_sources:
  - 用户批准的“修复计划修订时的依赖状态误重置”执行计划。
  - 用户确认增加间接受影响检查提示，且不修复真实项目的历史计划。
scope:
  - 仅直接修订条目重置状态，间接依赖保留原状态并在现有 message 中提示检查。
  - 同步正式规格与增量规格，更新测试和当前验收证据。
non_goals:
  - 不处理重复构建、循环收口、预算、历史计划迁移、前端功能或协议字段变更。
created: 2026-09-21
